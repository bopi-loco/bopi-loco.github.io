<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f5ef">
    <meta name="description" content="The BOPI-Loco project website is coming soon. Stay tuned.">
    <meta property="og:title" content="BOPI-Loco — Coming soon">
    <meta property="og:description" content="The BOPI-Loco project website is on its way.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://bopi-loco.github.io/">
    <title>BOPI-Loco — Coming soon</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #202820;
        background: #f4f5ef;
        -webkit-font-smoothing: antialiased;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        padding: clamp(24px, 5vw, 64px);
        background: radial-gradient(ellipse at 75% 30%, #e5ebd9 0, transparent 58%);
      }

      header, footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 24px;
      }

      .brand {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.04em;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #4d5948;
        font-size: 13px;
      }

      .status::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #5a7446;
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 88px 0;
        text-align: center;
      }

      h1 {
        margin: 0 0 24px;
        font-size: clamp(52px, 10vw, 144px);
        font-weight: 500;
        line-height: 1.05;
        letter-spacing: -0.075em;
      }

      main p {
        max-width: 34ch;
        margin: 0;
        color: #586151;
        font-size: clamp(16px, 2vw, 20px);
        line-height: 1.6;
      }

      footer {
        border-top: 1px solid #d6dccd;
        padding-top: 24px;
        color: #586151;
        font-size: 13px;
      }

      @media (max-width: 420px) {
        header, footer { flex-wrap: wrap; gap: 12px; }
        main { padding: 72px 0; }
      }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">BOPI-Loco</span>
      <span class="status">Website in progress</span>
    </header>
    <main>
      <h1>Coming soon.</h1>
      <p>The BOPI-Loco project website is on its way. Stay tuned.</p>
    </main>
    <footer>
      <span>bopi-loco.github.io</span>
    </footer>
  </body>
</html>
