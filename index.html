<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="The BOPI-Loco project website is coming soon. An ICRA 2027 submission.">
<meta property="og:title" content="BOPI-Loco — Coming soon">
<meta property="og:url" content="https://bopi-loco.github.io/">
<meta property="og:type" content="website">
<title>BOPI-Loco — Coming soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">

<style>
  /* --- design tokens --- */
  :root{
    --blue-5:#397FE7;
    --neutral-1:#8B8176;--neutral-5:#DDD1C4;
    --slate-1:#08111F;--slate-4:#53657E;--slate-5:#76889F;
    --bg:#FFFFFF;--ink:var(--slate-1);--ink-2:var(--slate-4);--ink-3:var(--slate-5);
    --accent:var(--blue-5);
    --line:var(--neutral-1);--line-soft:var(--neutral-5);
    --font:"Barlow","Helvetica Neue",Arial,sans-serif;
    --u:20px;--g:40px;
    color-scheme:light; /* committed light ground; no viewer dark-mode override */
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
       font-size:14px;line-height:18px;letter-spacing:-.3px;-webkit-font-smoothing:antialiased;
       display:flex;flex-direction:column}
  p{margin:0}

  nav{display:flex;align-items:center;gap:var(--u);
      padding:var(--u) var(--g);border-bottom:1px solid var(--line)}
  nav .wordmark{font:500 18px/24px var(--font);letter-spacing:.08em;text-transform:uppercase}

  main{flex:1;display:flex;flex-direction:column;justify-content:center;
       padding:80px var(--g);gap:var(--u)}

  /* rail eyebrow: 100px 1px accent rule, eyebrow 20px below */
  .eyebrow{position:relative;padding-top:var(--u);font-size:14px;
           text-transform:uppercase;letter-spacing:.08em;font-weight:500}
  .eyebrow::before{content:"";position:absolute;top:0;left:0;width:100px;height:1px;background:var(--accent)}

  h1{font:400 60px/66px var(--font);letter-spacing:-1px;margin:0;text-wrap:balance;max-width:16ch}
  .accent{color:var(--accent)}
  main p.note{color:var(--ink-2);max-width:46ch}

  footer{padding:var(--u) var(--g);border-top:1px solid var(--line-soft);
         color:var(--ink-3);font-size:12px;line-height:14px}

  @media (max-width:800px){
    nav,main,footer{padding-left:var(--u);padding-right:var(--u)}
    main{padding-block:56px}
    h1{font-size:36px;line-height:42px}
  }
</style>
</head>
<body>
<nav>
  <span class="wordmark">BOPI-Loco</span>
</nav>

<main>
  <p class="eyebrow">Project</p>
  <h1>The Project Site Is Coming <span class="accent">Soon.</span></h1>
  <p class="note">The paper is under review. Results, video, and code will be posted soon.
    Stay tuned!</p>
</main>

<footer>
  <span>bopi-loco.github.io</span>
</footer>
</body>
</html>
